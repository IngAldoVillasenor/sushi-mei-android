name: Android CI/CD Pipeline

# El workflow se disparará cuando hagas push o pull request a la rama 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Java 17 (Estándar para Android moderno)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Configura el caché de Gradle para que las ejecuciones sean mucho más rápidas
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Le da permisos de ejecución al wrapper de Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Corre el Linter para verificar que el código Jetpack Compose esté limpio
      - name: Run Android Lint
        run: ./gradlew lintDebug

      # 6. Ejecuta las pruebas unitarias
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 7. Compila el APK de prueba
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 8. Sube el APK generado a GitHub para que puedas descargarlo directamente
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk